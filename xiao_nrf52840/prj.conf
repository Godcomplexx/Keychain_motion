# Keep the learning build observable over the XIAO USB serial connection.
CONFIG_CONSOLE=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_REBOOT=y
CONFIG_PRINTK=y
CONFIG_USB_DEVICE_VID=0x2886
CONFIG_USB_DEVICE_PID=0x8044
CONFIG_USB_DEVICE_MANUFACTURER="SmartMotion"
CONFIG_USB_DEVICE_PRODUCT="KeychainSync"

# External OLED and MPU-6050 share the XIAO D4/D5 I2C pins.
CONFIG_I2C=y

# Preserve the Android application's existing GATT protocol.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="KeychainSync"
CONFIG_BT_DEVICE_APPEARANCE=0
CONFIG_BT_MAX_CONN=1
CONFIG_BT_GATT_DYNAMIC_DB=n
# A drawing packet carries two bytes per point, so a large MTU is the
# difference between 9 points per write and 120. At the default MTU of 23 a
# fast stroke arrives as a stutter of short segments.
# Connection parameters, measured rather than assumed.
#
# Zephyr's defaults ask the central for a 420 ms supervision timeout, and five
# seconds into every connection the peripheral requested exactly that: the link
# went from the 9600 ms Windows offered down to 420 ms and dropped a second
# later, every time. At a 45 ms interval that allows nine missed events before
# the link is declared dead, which is a coin toss rather than a connection.
#
# Four seconds is what ordinary peripherals use. The interval is asked down to
# 15-30 ms because every ATT transaction costs one interval, and a drawing
# stream is a lot of transactions.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
# The radio runs at 0 dBm by default. The nRF52840 will do +8, which is about
# two and a half times the range for a few milliamps while actually
# transmitting - and transmitting is a small fraction of the time.
# The standard Battery Service, rather than a characteristic of our own.
# It costs the same to publish and is read by anything that speaks Bluetooth -
# nRF Connect, Android's own device screen - not only by this project's app.
# Bluetooth 5 long range. The controller supports it but does not enable it,
# and the host needs BT_USER_PHY_UPDATE to let the application ask for it.
#
# The trade is range for speed and it is not small: the coded PHY sends each
# bit several times over. S=8 is four times the range at an eighth of the
# throughput; S=2 is roughly double the range at half. S=2 is what this asks
# for, because the drawing pad streams points and an eighth of the rate would
# be felt in the hand.
CONFIG_BT_CTLR_PHY_CODED=y
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_BAS=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# FLIP uses floating-point physics on the nRF52840 Cortex-M4F.
CONFIG_FPU=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# The complete framebuffer and animation state fit comfortably in 256 KiB RAM.
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_ASSERT=y
