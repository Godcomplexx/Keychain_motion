# BAT_SENSE reaches P0.02 / AIN0, and ACC_INT1 reaches P0.07. Both need their
# drivers even though the accelerometer is not soldered yet.
CONFIG_ADC=y
CONFIG_GPIO=y

# The E73 module supplies the mandatory 32 MHz radio crystal, but the final
# Gerber has no external 32.768 kHz crystal on XL1/XL2. Use the nRF52840's
# internal low-frequency RC oscillator and keep Zephyr's calibration enabled.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y

# The board overlay disables the DK console UART because it drives P0.06 and
# P0.08, the two pins this PCB wires to I2C. Its push-pull TX output held the
# open-drain bus, so no I2C device could ever acknowledge. The console now goes
# to a USB CDC port on the board's own USB-C connector instead, so it is kept.
CONFIG_UART_CONSOLE=y
