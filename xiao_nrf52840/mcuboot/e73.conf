# MCUboot for the E73 keychain PCB.
#
# The board has no UART pins and no buttons, so the USB-C connector wired to the
# module is the only possible update path. Serial recovery therefore runs over
# USB CDC ACM, and it is entered on request from the application instead of by
# holding a button or by delaying every single boot.

CONFIG_MAIN_STACK_SIZE=10240
CONFIG_MULTITHREADING=y

# Nothing on this PCB can receive a console, and serial recovery owns the port.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_SERIAL=y
CONFIG_UART_NRFX=n
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y

CONFIG_GPIO=y
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_CDC_ACM=y

# Recovery starts only when the application wrote the boot-mode flag into
# GPREGRET1 and rebooted. A normal boot goes straight to the application.
CONFIG_BOOT_SERIAL_BOOT_MODE=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
CONFIG_RETAINED_MEM=y
CONFIG_RETAINED_MEM_NRF_GPREGRET=y

CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_REMOTE_WAKEUP=n
CONFIG_USB_DEVICE_VID=0x2886
CONFIG_USB_DEVICE_PID=0x8045
CONFIG_USB_DEVICE_MANUFACTURER="SmartMotion"
CONFIG_USB_DEVICE_PRODUCT="Keychain DFU"

# The Gerber fits no 32.768 kHz crystal on XL1/XL2, exactly like the
# application build. The E73 module's own 32 MHz crystal is unaffected.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y

CONFIG_NORDIC_QSPI_NOR=n

# The signing key is NOT set here on purpose. MCUboot only resolves a relative
# key path against a file passed as CONF_FILE, and this file arrives through
# EXTRA_CONF_FILE, so a relative path here would silently resolve inside the
# MCUboot tree. tools/flash/build_e73.py passes an absolute path to
# CONFIG_BOOT_SIGNATURE_KEY_FILE instead, pointing at
# mcuboot/keychain-dev-rsa-2048.pem, which is generated locally and not
# committed. Building this bootloader by hand without that flag falls back to
# MCUboot's published development key, which authenticates nothing.
