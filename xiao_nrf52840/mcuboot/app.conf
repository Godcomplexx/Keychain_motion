# Application-side configuration for MCUboot updates on the E73 keychain PCB.
#
# Added on top of gerber.conf, and only for the E73 build. The XIAO builds must
# not use this file: those boards carry the factory UF2 bootloader and expect
# an image at 0x27000, not an MCUboot-signed image in slot0.

CONFIG_BOOTLOADER_MCUBOOT=y

# The same project key the bootloader was built with. Resolved relative to the
# application directory. Not committed - see mcuboot/e73.conf.
CONFIG_MCUBOOT_SIGNATURE_KEY_FILE="mcuboot/keychain-dev-rsa-2048.pem"

# GPREGRET survives a reset, so the application can leave a note asking the
# bootloader to start serial recovery instead of booting. This is what replaces
# the missing RESET button on this PCB.
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
CONFIG_RETAINED_MEM=y
CONFIG_RETAINED_MEM_NRF_GPREGRET=y

# Lets the application call boot_write_img_confirmed(). Serial recovery writes
# slot0 in place, so that call does nothing today; it is what would make a
# secondary-slot upload safe to revert, and nothing else here runs an SMP
# server that could confirm an image instead.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
